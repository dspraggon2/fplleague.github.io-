  <script type="module">function validatePeriods(periods, max = 38) {
  if (!Array.isArray(periods) || periods.length !== 4) throw new Error('Set all four mini-leagues.');
  let next = 1;
  for (const p of periods) {
    if (!Number.isInteger(p.start) || !Number.isInteger(p.end) || p.start !== next || p.end < p.start || p.end > max) {
      throw new Error('The four mini-leagues must cover the season in order, without gaps or overlaps.');
    }
    next = p.end + 1;
  }
  if (next !== max + 1) throw new Error('The final mini-league must end at GW ' + max + '.');
  return true;
}

function parseLeagueId(value) {
  const text = String(value || '').trim();
  if (/^[1-9]\d{0,9}$/.test(text)) return Number(text);
  try {
    const url = new URL(text);
    if (!['https:', 'http:'].includes(url.protocol) || url.hostname !== 'fantasy.premierleague.com') return null;
    const match = url.pathname.match(/^\/(?:[a-z]{2}\/)?leagues\/([1-9]\d{0,9})\/standings(?:\/c)?\/?$/);
    if (match && Number(match[1]) > 0) return Number(match[1]);
  } catch {}
  return null;
}

function scoreWeek(row, start, mode = 'all') {
  const hit = mode === 'none' || (mode === 'except-first' && row.event === start) ? 0 : Number(row.event_transfers_cost || 0);
  return { gross: Number(row.points || 0), hit, net: Number(row.points || 0) - hit };
}

function rankManagers(managers, period, through, mode = 'all') {
  const rows = managers.map(m => {
    const weeks = m.history.filter(w => w.event >= period.start && w.event <= Math.min(period.end, through));
    const sums = weeks.reduce((a,w) => {
      const s = scoreWeek(w, period.start, mode);
      a.gross += s.gross; a.hits += s.hit; a.points += s.net;
      return a;
    }, { gross: 0, hits: 0, points: 0 });
    const latest = m.history.find(w => w.event === through);
    return { ...m, ...sums, games: weeks.length, gw: latest ? scoreWeek(latest, period.start, mode).net : null };
  }).sort((a,b) => b.points - a.points || a.manager.localeCompare(b.manager) || a.id - b.id);
  let previous = null, rank = 0;
  return rows.map((r,i) => {
    if (r.points !== previous) rank = i + 1;
    previous = r.points;
    return {...r, rank};
  });
}

}
const sample=demoData();
const data=()=>dataset || sample;
function latest(){
  const d=data();
  const allowed=d.events.filter(e=>config.includeLive?(e.finished||e.is_current):(e.finished&&e.data_checked));
  const available=Math.max(0,...d.managers.flatMap(m=>m.history.map(w=>w.event)));
  return Math.min(available,Math.max(0,...allowed.map(e=>e.id)));
}
function period(){return view==='season'?{name:'Overall season',start:1,end:38}:config.periods[selected];}
function hitMode(){return view==='season'?'all':config.hitMode;}
function excluded(m,index=selected){return (config.excludedByPeriod?.[String(index+1)]||[]).includes(m.id);}
function standings(){return rankManagers(data().managers.filter(m=>view==='season'||!excluded(m)),period(),latest(),hitMode());}
function initials(name){return name.split(' ').map(n=>n[0]).slice(0,2).join('');}
function ruleText(){return {all:'All transfer hits deducted',none:'Transfer hits excluded','except-first':'Opening-gameweek hits excluded'}[hitMode()];}
function updated(){return !dataset?'Sample scores':new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}).format(new Date(dataset.fetchedAt));}

function renderRows(){
  const all=standings(),p=period(),gw=latest(),leading=all[0]?.points??0;
  const displayRows=[...all,...(view==='phase'?data().managers.filter(m=>excluded(m)).map(m=>({...m,inactive:true})):[])];

  if(!rows.length) return '<tr><td colspan="6"><div class="empty">No managers match your search.</div></td></tr>';
  const hasScores=gw>=p.start&&all.some(r=>r.games>0);
  return rows.map(r=>r.inactive?`<tr class="inactive"><td class="place">—</td><td><span class="team-name" style="text-decoration:line-through">${esc(r.team)}</span><span class="manager-name">${esc(r.manager)} · Not participating this quarter</span></td><td class="num">—</td><td class="num col-hits">—</td><td class="num">—</td><td class="num col-gap">—</td></tr>`:`<tr class="${r.rank===1&&hasScores?'leader':''}"><td class="place">${hasScores?(r.rank===1?'<span class="place-mark">1</span>':r.rank):'—'}</td><td><button class="manager-button" data-manager="${r.id}" aria-label="View ${esc(r.manager)} gameweek breakdown"><span class="mini-avatar c${r.id%4}" aria-hidden="true">${esc(initials(r.manager))}</span><span><span class="team-name">${esc(r.team)}</span><span class="manager-name">${esc(r.manager)}</span></span></button></td><td class="num">${gw>=p.start&&gw<=p.end&&r.gw!==null?format(r.gw):'—'}</td><td class="num col-hits ${r.hits?'hit':''}">${r.hits?'−'+r.hits:'—'}</td><td class="num score">${hasScores?format(r.points):'—'}</td><td class="num col-gap gap">${hasScores?(leading-r.points?format(leading-r.points):'—'):'—'}</td></tr>`).join('');
}

function chipName(name){return {wildcard:'Wildcard',freehit:'Free Hit',bboost:'Bench Boost','3xc':'Triple Captain',manager:'Assistant Manager'}[name]||name;}

async function api(path,signal){
  if(standalone)throw new Error('This HTML file contains a saved FPL snapshot. Live refresh needs the hosted site or the included local server. Your saved scores are still available.');
  const response=await fetch(path,{signal,cache:'no-cache'});
  const type=response.headers.get('content-type')||'';
  if(!type.includes('application/json'))throw new Error('The data service did not return FPL data. Refresh the page and try again.');
  const body=await response.json();
  if(!response.ok)throw new Error(body.error||'FPL could not return the requested data.');
  return body;
}
function updateProgress(text){progress=text;document.querySelectorAll('[data-progress],[data-submit-label]').forEach(el=>el.textContent=text);}
async function sync(next=config){
  if(busy||!next.leagueId)return false;
  busy=true;error='';progress='Connecting to FPL…';controller=new AbortController();const signal=controller.signal;render();
  try {
    const [eventData,first]=await Promise.all([api('/api/events',signal),api('/api/league/'+next.leagueId+'?page=1',signal)]);
    const entries=[...first.standings.results];let page=1,more=first.standings.has_next;
    while(more){
      if(entries.length>=500||page>=10)throw new Error('This dashboard supports mini-leagues of up to 500 managers. Please use your mini-league ID rather than a global league.');
      updateProgress('Loading league members…');
      const result=await api('/api/league/'+next.leagueId+'?page='+(++page),signal);
      entries.push(...result.standings.results);more=result.standings.has_next;
    }
    const unique=[...new Map(entries.map(e=>[e.entry,e])).values()];
    if(!unique.length)throw new Error('This league has no ranked managers yet. Try again after its first gameweek starts.');
    if(unique.length>500)throw new Error('This dashboard supports up to 500 managers.');
    let completed=0,cursor=0;const managers=new Array(unique.length);
    async function run(){while(cursor<unique.length){
      if(signal.aborted)throw new DOMException('Cancelled','AbortError');
      const i=cursor++,e=unique[i];
      const history=await api('/api/entry/'+e.entry+'/history',signal);
      managers[i]={id:e.entry,manager:e.player_name,team:e.entry_name,history:history.current,chips:history.chips};
      updateProgress('Loading scores · '+(++completed)+' / '+unique.length);
    }}
    await Promise.all(Array.from({length:Math.min(4,unique.length)},()=>run()));
    if(signal.aborted)throw new DOMException('Cancelled','AbortError');
    if(!eventData.events.length)throw new Error('FPL has not returned the current season yet.');
    validatePeriods(next.periods,Math.max(...eventData.events.map(e=>e.id)));
    config={...next,title:next.title||first.league.name};
    dataset={league:first.league,managers,events:eventData.events,fetchedAt:new Date().toISOString(),sourceMode:'live'};
    save('four-quarters:config:v1',config);save('four-quarters:data:v1',dataset);
    selected=config.active-1;query='';
    return true;
  } catch(e){
    if(e.name!=='AbortError')error=e.message;
    controller.abort();
    return false;
  } finally {busy=false;progress='';controller=null;render();}
}

function exportCsv(){
  const rows=standings(),p=period(),gw=latest();
  const lines=[['Data source',isDemo()?'DEMO / SAMPLE DATA':'Fantasy Premier League'],['League',isDemo()?'Sample league':config.title],['Period',p.name],['Rules status',view==='season'?'FPL season scoring':config.rulesConfirmed?'Confirmed':'DRAFT: gameweek ranges not confirmed'],['Gameweeks',p.start+'–'+p.end],['Through gameweek',gw],['Transfer hits',ruleText()],['Updated',dataset?.fetchedAt||'Sample data'],[],['Rank','Team','Manager','Points scored','Hits deducted','Net points'],...rows.map(r=>[r.rank,r.team,r.manager,r.gross,r.hits,r.points])];
  const csv='\uFEFF'+lines.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');a.href=url;a.download=(isDemo()?'DEMO-':'')+'four-quarters-'+(view==='season'?'season':'mini-league-'+(selected+1))+'-gw'+gw+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Standings exported'+(isDemo()?' with sample-data label.':'.'));
}
let toastTimer;
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4000);}
document.addEventListener('click',e=>{
  const phase=e.target.closest('[data-phase]');if(phase){selected=Number(phase.dataset.phase);view='phase';query='';render();return;}
  const manager=e.target.closest('[data-manager]');if(manager){openManager(Number(manager.dataset.manager));return;}
  const button=e.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action;
  if(action==='settings')openSettings();
  if(action==='close-settings'){controller?.abort();document.getElementById('settings').close();}
  if(action==='close-manager')document.getElementById('manager').close();
  if(action==='refresh')refreshScores().then(ok=>{if(ok)toast(isPages?'Latest published scores loaded.':'Scores refreshed from FPL.');});
  if(action==='cancel')controller?.abort();
  if(action==='export')exportCsv();
  if(action==='season'){view='season';query='';render();}
  if(action==='overview'){view='phase';selected=config.active-1;query='';render();}
});
document.getElementById('settings').addEventListener('cancel',()=>controller?.abort());
render();
if(!standalone && config.leagueId){
  refreshScores();
  setInterval(()=>{
    if(document.visibilityState==='visible'&&!busy&&!document.getElementById('settings').open&&!document.getElementById('manager').open&&document.activeElement?.tagName!=='INPUT')refreshScores(true);
  },5*60*1000);
}

function openSharedRules(){
  const dialog=document.getElementById('settings');
  const repository=config.repositoryUrl;
  const editUrl=repository==='https://github.com/dspraggon2/fplleague.github.io-'?repository+'/edit/main/league-config.json':null;
  dialog.innerHTML=`<div class="dialog-head"><h2 id="settings-title">Shared league rules</h2><button class="icon-btn" data-action="close-settings" aria-label="Close rules">${icon('close')}</button></div><div class="dialog-body"><p class="dialog-intro">Every visitor sees the same scoring rules. ${config.rulesConfirmed?'':'These gameweek ranges are still draft and need confirming by the organiser.'}</p><table class="history-table"><thead><tr><th>Mini-league</th><th>Gameweeks</th></tr></thead><tbody>${config.periods.map((p,i)=>`<tr><td>${esc(p.name)}${i+1===config.active?' · Active':''}</td><td>GW ${p.start}–${p.end}</td></tr>`).join('')}</tbody></table><p class="dialog-footer-note">${{all:'All transfer hits deducted',none:'Transfer hits ignored','except-first':'Each mini-league’s first-gameweek hits excluded'}[config.hitMode]}. ${config.includeLive?'In-progress FPL scores are included and may change.':'Only finished, checked gameweeks are included.'}<br>FPL scores are collected by GitHub Actions approximately every hour. This page checks for published updates every five minutes while visible.</p>${editUrl?`<div class="form-actions"><a class="btn primary" href="${editUrl}" target="_blank" rel="noopener noreferrer">Edit rules on GitHub</a></div><small class="helper">Changes must be committed by the repository owner. Friends can view the rules without changing the shared standings.</small>`:''}</div>`;
  dialog.showModal();
}

async function refreshScores(quiet=false){
  if(!isPages)return sync();
  if(busy)return false;
  busy=true;controller=new AbortController();
  if(!quiet){error='';progress='Checking for published scores…';render();}
  try{
    const stamp=Date.now();
    const [freshConfig,freshData]=await Promise.all([
      api('./data/config.json?t='+stamp,controller.signal),api('./data/league.json?t='+stamp,controller.signal)
    ]);
    if(!validConfig(freshConfig)||freshData.league?.id!==freshConfig.leagueId||!Array.isArray(freshData.events)||!freshData.events.length||!Array.isArray(freshData.managers)||!freshData.managers.length||!freshData.managers.every(m=>Number.isInteger(m.id)&&Array.isArray(m.history))||!Number.isFinite(Date.parse(freshData.fetchedAt)))throw new Error('Published league data is incomplete. The last successful scores are still shown.');
    config=freshConfig;dataset=freshData;error='';
    save('four-quarters:data:v1',dataset);
    return true;
  }catch(e){if(e.name!=='AbortError')error=e.message;return false;}
  finally{busy=false;controller=null;progress='';render();}
}
</script>
